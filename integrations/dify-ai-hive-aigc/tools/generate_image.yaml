identity:
  author: wubin1836
  name: generate_image
  label:
    en_US: Generate or Edit Image
    zh_Hans: 图片生成与编辑
  description:
    en_US: Generate commercial images with Nano Banana Pro, GPT Image 2, Seedream 5 Lite or Nano Banana 2.
    zh_Hans: 使用 Nano Banana Pro、GPT Image 2、Seedream 5 Lite 或 Nano Banana 2 生成和编辑电商图、商品图、广告图、详情页、海报与种草素材。
description:
  human:
    en_US: Generate or edit images for e-commerce, marketing, advertising and social content.
    zh_Hans: 生成或编辑电商、营销、广告、带货、种草和社交媒体图片。
  llm: Generate or edit a commercial image from a prompt and optional reference images through AI Hive.
parameters:
  - name: prompt
    type: string
    required: true
    form: llm
    label:
      en_US: Prompt
      zh_Hans: 图片要求
    human_description:
      en_US: Describe the subject, use case, composition, style, text and constraints.
      zh_Hans: 描述主体、用途、构图、风格、文字和必须保留的内容。
    llm_description: A detailed image generation or editing instruction.
  - name: reference_images
    type: files
    required: false
    form: llm
    label:
      en_US: Reference images
      zh_Hans: 参考图片
    human_description:
      en_US: Optional product, person, composition or style references.
      zh_Hans: 可选的商品、人物、构图或风格参考图。
  - name: model
    type: select
    required: true
    form: form
    default: public_model_nano_banana_pro
    label:
      en_US: Model
      zh_Hans: 模型
    options:
      - value: public_model_nano_banana_pro
        label: { en_US: Nano Banana Pro, zh_Hans: Nano Banana Pro }
      - value: public_model_gpt_image_2
        label: { en_US: GPT Image 2, zh_Hans: GPT Image 2 }
      - value: public_model_seedream_5_0_lite
        label: { en_US: Seedream 5 Lite, zh_Hans: Seedream 5 Lite }
      - value: public_model_nano_banana_2
        label: { en_US: Nano Banana 2, zh_Hans: Nano Banana 2 }
  - name: batch_size
    type: number
    required: false
    form: form
    default: 1
    min: 1
    max: 4
    label:
      en_US: Number of images
      zh_Hans: 生成数量
  - name: routing_mode
    type: select
    required: true
    form: form
    default: COST_FIRST
    label:
      en_US: Routing
      zh_Hans: 路由方式
    options:
      - value: COST_FIRST
        label: { en_US: Cost first, zh_Hans: 价格优先 }
      - value: SPEED_FIRST
        label: { en_US: Speed first, zh_Hans: 速度优先 }
      - value: SUCCESS_FIRST
        label: { en_US: Success first, zh_Hans: 成功率优先 }
  - name: model_params
    type: string
    required: false
    form: form
    default: "{}"
    label:
      en_US: Advanced parameters (JSON)
      zh_Hans: 高级参数（JSON）
  - name: wait_for_result
    type: boolean
    required: true
    form: form
    default: true
    label:
      en_US: Wait for result
      zh_Hans: 等待生成结果
  - name: timeout_seconds
    type: number
    required: false
    form: form
    default: 600
    min: 30
    max: 1200
    label:
      en_US: Wait timeout
      zh_Hans: 等待超时秒数
output_schema:
  type: object
  properties:
    task_id: { type: string }
    status: { type: string }
    result_urls:
      type: array
      items: { type: string }
extra:
  python:
    source: tools/generate_image.py
