interface:
  display_name: "AI核算接单项目真实成本"
  short_description: "让普通人用AI-HIVE完成把沟通、修改、工具、税费和机会成本纳入项目核算"
  default_prompt: "使用 $ai-hive-solo-project-costing 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
