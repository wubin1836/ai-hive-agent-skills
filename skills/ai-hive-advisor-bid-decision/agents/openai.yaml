interface:
  display_name: "招投标决策顾问"
  short_description: "招投标决策顾问：明确问题、给出专项方案与可验收交付，按需连接 AI-HIVE"
  default_prompt: "请使用 $ai-hive-advisor-bid-decision，我们只能投入一个项目投标，我提供两个项目的招标文件和真实能力清单。请按硬门槛、资源和付款安排比较，先给选择依据，不编写完整标书。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "按需接入已授权图片和视频能力，纯诊断与文字任务不要求付费生成"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
