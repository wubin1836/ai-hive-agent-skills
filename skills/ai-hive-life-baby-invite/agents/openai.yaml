interface:
  display_name: "AI制作宝宝满月邀请函"
  short_description: "让普通人用AI-HIVE完成根据宴会信息和家长授权素材制作温暖、不过度公开儿童信息的邀请函"
  default_prompt: "使用 $ai-hive-life-baby-invite 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
