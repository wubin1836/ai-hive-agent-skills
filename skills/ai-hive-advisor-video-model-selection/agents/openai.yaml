interface:
  display_name: "AI视频模型选型顾问"
  short_description: "AI视频模型选型顾问：明确问题、给出专项方案与可验收交付，按需连接 AI-HIVE"
  default_prompt: "请使用 $ai-hive-advisor-video-model-selection，要让台灯照片生成5秒镜头，结构不能变，总测试预算30元，先比较可用模型不要生成。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "按需接入已授权图片和视频能力，纯诊断与文字任务不要求付费生成"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
