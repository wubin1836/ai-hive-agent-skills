interface:
  display_name: "AI发现经营数据异常"
  short_description: "让普通人用AI-HIVE完成从历史基线与业务事件中发现异常指标，并区分数据错误和业务变化"
  default_prompt: "使用 $ai-hive-boss-business-anomaly 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
