interface:
  display_name: "AI为项目建立文件命名规则"
  short_description: "让普通人用AI-HIVE完成建立客户、日期、内容、版本和状态一致的文件命名规范"
  default_prompt: "使用 $ai-hive-solo-file-naming 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
