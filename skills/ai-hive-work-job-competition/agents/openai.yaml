interface:
  display_name: "AI做岗位竞聘材料"
  short_description: "让普通人用AI-HIVE完成根据岗位要求提出匹配证据、上岗计划和可衡量目标"
  default_prompt: "使用 $ai-hive-work-job-competition 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
