interface:
  display_name: "AI家具摆放效果预览"
  short_description: "让普通人用AI-HIVE完成按真实户型和家具尺寸比较多个摆放方案，减少购买与动线冲突"
  default_prompt: "使用 $ai-hive-life-furniture-layout-preview 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
