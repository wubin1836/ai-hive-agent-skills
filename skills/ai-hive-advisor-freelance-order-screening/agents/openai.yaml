interface:
  display_name: "接单避坑顾问"
  short_description: "接单避坑顾问：明确问题、给出专项方案与可验收交付，按需连接 AI-HIVE"
  default_prompt: "请使用 $ai-hive-advisor-freelance-order-screening，假设客户要我3天交10张海报，预算2000元，先完成全部再决定付款。请用这段聊天判断待确认风险，并给礼貌提问。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "按需接入已授权图片和视频能力，纯诊断与文字任务不要求付费生成"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
