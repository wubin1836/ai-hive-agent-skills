interface:
  display_name: "AI制作情绪日记回顾"
  short_description: "让普通人用AI-HIVE完成帮助用户从日记中看到事件、感受和需求模式，不替代心理治疗"
  default_prompt: "使用 $ai-hive-life-emotion-journal 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
