interface:
  display_name: "AI生成测试用例清单"
  short_description: "让普通人用AI-HIVE完成从真实需求提取正常、边界、异常和权限场景供测试人员复核"
  default_prompt: "使用 $ai-hive-work-test-cases 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
