interface:
  display_name: "品牌战略顾问"
  short_description: "品牌战略顾问：明确问题、给出专项方案与可验收交付，按需连接 AI-HIVE"
  default_prompt: "请使用 $ai-hive-advisor-brand-strategy，我们有一个公司品牌和三个产品名，客户常分不清，用这些访谈比较保留子品牌还是统一。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "按需接入已授权图片和视频能力，纯诊断与文字任务不要求付费生成"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
