interface:
  display_name: "AI制作社群每日内容"
  short_description: "让普通人用AI-HIVE完成围绕社群目标安排不重复的知识、互动、提醒和复盘内容"
  default_prompt: "使用 $ai-hive-solo-community-daily-content 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
