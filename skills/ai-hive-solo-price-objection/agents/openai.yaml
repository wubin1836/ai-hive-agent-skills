interface:
  display_name: "AI回复客户压价"
  short_description: "让普通人用AI-HIVE完成用范围、价值和替代方案回应压价，不攻击客户或虚构稀缺性"
  default_prompt: "使用 $ai-hive-solo-price-objection 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
