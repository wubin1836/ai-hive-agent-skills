interface:
  display_name: "AI写正式通知公告"
  short_description: "让普通人用AI-HIVE完成根据对象、事项、生效时间和联系人生成清晰、无歧义的正式通知"
  default_prompt: "使用 $ai-hive-work-formal-notice 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
