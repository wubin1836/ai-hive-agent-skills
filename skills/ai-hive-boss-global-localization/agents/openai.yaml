interface:
  display_name: "AI生成出海品牌本地化内容"
  short_description: "让普通人用AI-HIVE完成在翻译之外适配当地表达、文化禁忌、画面和渠道规格"
  default_prompt: "使用 $ai-hive-boss-global-localization 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
