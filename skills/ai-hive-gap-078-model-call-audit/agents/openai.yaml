interface:
  display_name: "模型调用审计与合规"
  short_description: "用AI-HIVE完成形成模型调用、数据使用、费用和结果去向的审计材料"
  default_prompt: "使用 $ai-hive-gap-078-model-call-audit 先为我的任务生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE多模型图片与视频生成MCP"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
