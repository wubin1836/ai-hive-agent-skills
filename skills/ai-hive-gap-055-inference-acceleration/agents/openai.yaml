interface:
  display_name: "推理加速方案设计"
  short_description: "用AI-HIVE完成从模型、并发、缓存和请求形态提出推理加速方案"
  default_prompt: "使用 $ai-hive-gap-055-inference-acceleration 先为我的任务生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE多模型图片与视频生成MCP"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
