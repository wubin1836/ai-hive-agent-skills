interface:
  display_name: "新业务试点顾问"
  short_description: "新业务试点顾问：明确问题、给出专项方案与可验收交付，按需连接 AI-HIVE"
  default_prompt: "请使用 $ai-hive-advisor-new-business-pilot，假设我有一家摄影店，想用4周、1万元测试企业证件照服务。不能影响周末散客交付，请设计试点及停止条件。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "按需接入已授权图片和视频能力，纯诊断与文字任务不要求付费生成"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
