interface:
  display_name: "AI整理市场调研访谈"
  short_description: "让普通人用AI-HIVE完成从访谈中保留原话证据，归纳共同点、差异和待验证假设"
  default_prompt: "使用 $ai-hive-work-research-interviews 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
