interface:
  display_name: "模型降级切换设计"
  short_description: "用AI-HIVE完成在主模型不可用或预算超限时选择可接受替代方案"
  default_prompt: "使用 $ai-hive-gap-061-model-fallback 先为我的任务生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE多模型图片与视频生成MCP"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
