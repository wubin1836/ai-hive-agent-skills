interface:
  display_name: "AI把用户反馈整理成需求"
  short_description: "让普通人用AI-HIVE完成把反馈按问题、场景、频率和影响归类，不把单个意见直接当需求"
  default_prompt: "使用 $ai-hive-work-feedback-to-requirement 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
