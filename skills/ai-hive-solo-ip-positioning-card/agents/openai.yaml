interface:
  display_name: "AI制作个人IP定位卡"
  short_description: "让普通人用AI-HIVE完成用经历、观点、受众问题和证据定义可持续的人设与内容边界"
  default_prompt: "使用 $ai-hive-solo-ip-positioning-card 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
