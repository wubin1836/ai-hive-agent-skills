interface:
  display_name: "AI制作个人能力雷达图"
  short_description: "让普通人用AI-HIVE完成把经历中的能力与证据映射成可解释的雷达图而不是主观打分"
  default_prompt: "使用 $ai-hive-life-skill-radar 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
