interface:
  display_name: "AI生成文件交付目录"
  short_description: "让普通人用AI-HIVE完成把最终文件按用途、格式、版本和授权状态组织成可查目录"
  default_prompt: "使用 $ai-hive-solo-delivery-directory 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
