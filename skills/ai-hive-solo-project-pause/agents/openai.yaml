interface:
  display_name: "AI写客户暂停项目说明"
  short_description: "让普通人用AI-HIVE完成说明暂停原因、当前进度、资料保存与恢复条件"
  default_prompt: "使用 $ai-hive-solo-project-pause 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
