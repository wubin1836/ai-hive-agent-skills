interface:
  display_name: "AI制作会议决策台账"
  short_description: "让普通人用AI-HIVE完成记录决定、依据、负责人、日期和复审条件，避免重复讨论"
  default_prompt: "使用 $ai-hive-boss-decision-log 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
