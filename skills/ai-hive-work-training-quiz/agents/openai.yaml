interface:
  display_name: "AI生成培训测验题"
  short_description: "让普通人用AI-HIVE完成从培训材料生成覆盖理解与应用的题目并标注原文依据"
  default_prompt: "使用 $ai-hive-work-training-quiz 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
