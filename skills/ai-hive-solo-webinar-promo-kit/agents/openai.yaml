interface:
  display_name: "AI制作线上讲座宣传包"
  short_description: "让普通人用AI-HIVE完成用同一场讲座信息生成报名页、预热内容、海报和提醒消息"
  default_prompt: "使用 $ai-hive-solo-webinar-promo-kit 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
