interface:
  display_name: "AI整理项目依赖关系"
  short_description: "让普通人用AI-HIVE完成识别前置输入、跨团队责任和单点风险，形成依赖地图"
  default_prompt: "使用 $ai-hive-work-dependency-map 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
