interface:
  display_name: "AI从长视频提炼短视频选题"
  short_description: "让普通人用AI-HIVE完成从长视频中提取能独立成立、开头明确且不失真的短内容主题"
  default_prompt: "使用 $ai-hive-solo-long-video-topics 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
