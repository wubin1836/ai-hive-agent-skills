interface:
  display_name: "AI制作提案样片防误用水印"
  short_description: "让普通人用AI-HIVE完成为未付款或未授权的预览稿设计不妨碍审阅但难以误用的水印方案"
  default_prompt: "使用 $ai-hive-solo-proof-watermark 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
