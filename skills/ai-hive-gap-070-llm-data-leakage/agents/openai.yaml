  short_description: "用AI-HIVE完成梳理提示词、附件、日志和工具调用中的数据泄露路径"
  default_prompt: "使用 $ai-hive-gap-070-llm-data-leakage 先为我的任务生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE多模型图片与视频生成MCP"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
