interface:
  display_name: "AI生成新员工入职训练"
  short_description: "让普通人用AI-HIVE完成把岗位目标、SOP、常见错误和实操任务组织成分阶段训练"
  default_prompt: "使用 $ai-hive-boss-onboarding-training 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
