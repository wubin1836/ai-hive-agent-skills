interface:
  display_name: "AI分析产品定价区间"
  short_description: "让普通人用AI-HIVE完成根据成本、客户价值、竞品和渠道建立可解释的价格区间"
  default_prompt: "使用 $ai-hive-boss-pricing-range 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
