interface:
  display_name: "AI整理培训反馈"
  short_description: "让普通人用AI-HIVE完成汇总满意度、理解难点、建议与具体原话，避免只算平均分"
  default_prompt: "使用 $ai-hive-work-training-feedback 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
