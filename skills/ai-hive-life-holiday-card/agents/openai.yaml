interface:
  display_name: "AI生成节日家庭祝福卡"
  short_description: "让普通人用AI-HIVE完成基于家庭真实照片与关系生成得体、可个性化的节日祝福卡"
  default_prompt: "使用 $ai-hive-life-holiday-card 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
