interface:
  display_name: "AI写平台申诉材料"
  short_description: "让普通人用AI-HIVE完成基于真实规则与证据写清事件、请求和附件，不规避平台审核"
  default_prompt: "使用 $ai-hive-life-platform-appeal 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
