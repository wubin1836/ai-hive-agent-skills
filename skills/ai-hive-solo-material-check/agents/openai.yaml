interface:
  display_name: "AI检查客户供料是否完整"
  short_description: "让普通人用AI-HIVE完成对照交付要求检查素材数量、质量、格式、授权和版本"
  default_prompt: "使用 $ai-hive-solo-material-check 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
