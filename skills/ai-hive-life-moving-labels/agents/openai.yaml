interface:
  display_name: "AI制作搬家收纳标签"
  short_description: "让普通人用AI-HIVE完成按房间、易碎程度和开箱优先级生成可打印标签与清单"
  default_prompt: "使用 $ai-hive-life-moving-labels 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
