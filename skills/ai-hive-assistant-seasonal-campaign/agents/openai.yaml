  short_description: "节日营销助手：围绕实际输入完成专项工作，按需接入 AI-HIVE 图视频能力"
  default_prompt: "请使用 $ai-hive-assistant-seasonal-campaign，我们茶具品牌想做2026年中秋内容，先核对日期，方案以家庭共饮为主题，不打折。"
dependencies:
