interface:
  display_name: "AI写自我介绍不同版本"
  short_description: "让普通人用AI-HIVE完成根据面试、会议、社交等场合生成基于真实经历的不同长度介绍"
  default_prompt: "使用 $ai-hive-life-self-introduction 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
