  short_description: "让普通人用AI-HIVE完成根据品牌目标与创作者真实能力设计可执行、可量化的合作方案"
  default_prompt: "使用 $ai-hive-solo-brand-proposal 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
