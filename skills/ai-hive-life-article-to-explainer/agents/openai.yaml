interface:
  display_name: "AI把文章变成解说视频"
  short_description: "让普通人用AI-HIVE完成从文章提炼主线、证据与画面，制作适合短视频或横屏的解说方案"
  default_prompt: "使用 $ai-hive-life-article-to-explainer 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
