interface:
  display_name: "AI准备银行融资材料"
  short_description: "让普通人用AI-HIVE完成按银行清单整理企业、经营、财务和用途资料，不伪造证明"
  default_prompt: "使用 $ai-hive-boss-bank-financing 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
