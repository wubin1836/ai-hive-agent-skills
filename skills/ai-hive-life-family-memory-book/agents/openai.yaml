interface:
  display_name: "AI生成家庭纪念册"
  short_description: "让普通人用AI-HIVE完成按时间、人物和事件整理家庭照片，形成可打印或分享的纪念册"
  default_prompt: "使用 $ai-hive-life-family-memory-book 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
