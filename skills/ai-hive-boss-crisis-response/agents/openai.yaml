interface:
  display_name: "AI制定危机公关回复"
  short_description: "让普通人用AI-HIVE完成在事实尚未完整时区分已知、未知和正在处理事项，形成分阶段回应"
  default_prompt: "使用 $ai-hive-boss-crisis-response 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
