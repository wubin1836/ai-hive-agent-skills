interface:
  display_name: "AI制作作品集项目故事"
  short_description: "让普通人用AI-HIVE完成把项目背景、限制、过程和结果写成可核验的作品集故事"
  default_prompt: "使用 $ai-hive-solo-portfolio-story 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
