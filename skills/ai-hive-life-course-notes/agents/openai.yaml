interface:
  display_name: "AI整理网课重点笔记"
  short_description: "让普通人用AI-HIVE完成把课程字幕或笔记整理成章节重点、例题、术语和复习任务"
  default_prompt: "使用 $ai-hive-life-course-notes 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
