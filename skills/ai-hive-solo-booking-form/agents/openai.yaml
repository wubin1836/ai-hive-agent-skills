interface:
  display_name: "AI生成咨询预约问卷"
  short_description: "让普通人用AI-HIVE完成在预约前收集足够背景、目标和风险信息，减少无效会议"
  default_prompt: "使用 $ai-hive-solo-booking-form 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
