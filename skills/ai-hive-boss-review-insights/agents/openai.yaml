interface:
  display_name: "AI汇总客户差评问题"
  short_description: "让普通人用AI-HIVE完成从评价中区分产品、履约、服务和预期落差，保留原始证据"
  default_prompt: "使用 $ai-hive-boss-review-insights 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
