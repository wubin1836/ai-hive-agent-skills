interface:
  display_name: "AI制作招商介绍资料"
  short_description: "让普通人用AI-HIVE完成把商业模式、市场证据、合作条件和支持体系做成可信招商材料"
  default_prompt: "使用 $ai-hive-boss-investment-brochure 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
