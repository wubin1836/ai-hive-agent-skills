interface:
  display_name: "AI制作宠物拟人短片"
  short_description: "让普通人用AI-HIVE完成用宠物真实照片生成轻松有趣的拟人故事，同时保留明显的娱乐表达"
  default_prompt: "使用 $ai-hive-life-pet-character-video 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
