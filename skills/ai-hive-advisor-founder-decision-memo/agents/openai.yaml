interface:
  display_name: "企业家决策备忘顾问"
  short_description: "企业家决策备忘顾问：明确问题、给出专项方案与可验收交付，按需连接 AI-HIVE"
  default_prompt: "请使用 $ai-hive-advisor-founder-decision-memo，假设我有2家店，新增门店预算60万元。请根据附上的12个月经营摘要，对扩店和改善老店写一页决策备忘，缺数据处标明。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "按需接入已授权图片和视频能力，纯诊断与文字任务不要求付费生成"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
