  short_description: "职场重启助手：围绕实际输入完成专项工作，按需接入 AI-HIVE 图视频能力"
  default_prompt: "请使用 $ai-hive-assistant-career-restart，我照顾家人两年，现在每天有六小时可工作，想恢复以前的财务助理方向。"
dependencies:
