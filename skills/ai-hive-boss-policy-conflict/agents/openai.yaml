interface:
  display_name: "AI检查公司制度冲突"
  short_description: "让普通人用AI-HIVE完成比较不同制度中的定义、权限、流程与处罚是否矛盾"
  default_prompt: "使用 $ai-hive-boss-policy-conflict 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
