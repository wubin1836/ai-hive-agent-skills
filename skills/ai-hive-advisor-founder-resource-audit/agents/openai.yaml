  short_description: "创业者资源盘点顾问：明确问题、给出专项方案与可验收交付，按需连接 AI-HIVE"
  default_prompt: "请使用 $ai-hive-advisor-founder-resource-audit，假设我想在30天内试做上门摄影，已有相机、6份作品和周末16小时，预算3000元。请盘点资源缺口，朋友场地还没获准使用。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "按需接入已授权图片和视频能力，纯诊断与文字任务不要求付费生成"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
