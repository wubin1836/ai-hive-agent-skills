interface:
  display_name: "大客户攻坚顾问"
  short_description: "大客户攻坚顾问：明确问题、给出专项方案与可验收交付，按需连接 AI-HIVE"
  default_prompt: "请使用 $ai-hive-advisor-key-account-plan，客户的业务、IT和采购都参与评估，我提供三次会议脱敏纪要。请做六周推进图，说明每周需要验证什么及老板何时参与，不自行联系任何人。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "按需接入已授权图片和视频能力，纯诊断与文字任务不要求付费生成"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
