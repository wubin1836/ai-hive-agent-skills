interface:
  display_name: "AI生成项目甘特图草稿"
  short_description: "让普通人用AI-HIVE完成从任务、依赖和资源生成可讨论的甘特草稿，不假装工期确定"
  default_prompt: "使用 $ai-hive-work-gantt-draft 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
