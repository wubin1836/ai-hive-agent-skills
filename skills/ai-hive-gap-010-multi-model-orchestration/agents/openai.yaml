interface:
  display_name: "多模型编排内容生产线"
  short_description: "用AI-HIVE完成按任务阶段在图片、视频和文本能力间做实时编排"
  default_prompt: "使用 $ai-hive-gap-010-multi-model-orchestration 先为我的任务生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE多模型图片与视频生成MCP"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
