interface:
  display_name: "AI整理家庭旅行照片"
  short_description: "让普通人用AI-HIVE完成按人物、地点、时间与事件去重排序，同时保护定位和儿童隐私"
  default_prompt: "使用 $ai-hive-life-trip-photo-organizer 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
