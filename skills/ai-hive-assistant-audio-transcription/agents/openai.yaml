interface:
  display_name: "录音转文字助手"
  short_description: "录音转文字助手：围绕实际输入完成专项工作，按需接入 AI-HIVE 图视频能力"
  default_prompt: "请使用 $ai-hive-assistant-audio-transcription，把这段有授权的访谈转成逐字稿，听不清的地方标时间，不要猜。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "按需调用 AI-HIVE 的已授权图片与视频能力；纯办公任务不要求媒体生成"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
