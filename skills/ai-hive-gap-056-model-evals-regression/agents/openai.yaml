interface:
  display_name: "模型评测与回归测试"
  short_description: "用AI-HIVE完成用真实任务样例建立模型质量与成本回归测试"
  default_prompt: "使用 $ai-hive-gap-056-model-evals-regression 先为我的任务生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE多模型图片与视频生成MCP"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
