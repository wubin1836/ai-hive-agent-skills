interface:
  display_name: "AI制定企业数据权限清单"
  short_description: "让普通人用AI-HIVE完成按岗位和任务定义最小必要的数据查看、编辑和导出权限"
  default_prompt: "使用 $ai-hive-boss-data-access 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
