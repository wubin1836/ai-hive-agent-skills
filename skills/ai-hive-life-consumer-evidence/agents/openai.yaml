interface:
  display_name: "AI整理消费维权证据"
  short_description: "让普通人用AI-HIVE完成按时间、订单、沟通与损失整理已有证据，不虚构或诱导过度索赔"
  default_prompt: "使用 $ai-hive-life-consumer-evidence 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
