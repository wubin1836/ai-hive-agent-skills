interface:
  display_name: "AI把咨询录屏变成教程"
  short_description: "让普通人用AI-HIVE完成从授权录屏提炼通用步骤，删除客户隐私并形成教程"
  default_prompt: "使用 $ai-hive-solo-recording-tutorial 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
