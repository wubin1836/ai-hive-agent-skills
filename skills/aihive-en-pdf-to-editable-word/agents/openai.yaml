  short_description: "PDF to Editable Word with verified outputs"
  default_prompt: "Use $aihive-en-pdf-to-editable-word with my source PDF. Produce converted.docx, comparison-notes.md, with the remaining review records. Verify this acceptance condition: The result is genuinely editable and material differences are listed. Tell me what is missing before uploads, paid generation or external changes."
