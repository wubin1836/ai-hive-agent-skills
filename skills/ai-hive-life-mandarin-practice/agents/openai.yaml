interface:
  display_name: "AI练习普通话口语"
  short_description: "让普通人用AI-HIVE完成围绕常见发音和表达场景生成练习脚本与自评记录"
  default_prompt: "使用 $ai-hive-life-mandarin-practice 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
