interface:
  display_name: "AI读懂汽车配置表"
  short_description: "让普通人用AI-HIVE完成把配置表转换成使用场景差异，并标明需以厂商最新资料为准"
  default_prompt: "使用 $ai-hive-life-car-specs 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
