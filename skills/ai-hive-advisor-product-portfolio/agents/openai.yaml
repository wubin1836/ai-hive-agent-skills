  default_prompt: "请使用 $ai-hive-advisor-product-portfolio，我们有3条软件产品线，收入相近但维护工时不同，这里有半年数据，决定下季度资源投入。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "按需接入已授权图片和视频能力，纯诊断与文字任务不要求付费生成"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
