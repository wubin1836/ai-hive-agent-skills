interface:
  display_name: "AI做季度工作复盘"
  short_description: "让普通人用AI-HIVE完成按目标、动作、结果、偏差和下一季策略完成季度复盘"
  default_prompt: "使用 $ai-hive-work-quarterly-review 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
