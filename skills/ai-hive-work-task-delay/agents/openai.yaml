interface:
  display_name: "AI写任务延期说明"
  short_description: "让普通人用AI-HIVE完成基于真实进度说明原因、影响、补救和新日期，不推卸责任"
  default_prompt: "使用 $ai-hive-work-task-delay 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
