interface:
  display_name: "AI生成项目风险周报"
  short_description: "让普通人用AI-HIVE完成只汇报真实变化、触发信号、影响和需要的支持"
  default_prompt: "使用 $ai-hive-work-risk-weekly 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
