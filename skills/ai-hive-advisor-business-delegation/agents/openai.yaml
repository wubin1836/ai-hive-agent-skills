interface:
  display_name: "业务委派顾问"
  short_description: "业务委派顾问：明确问题、给出专项方案与可验收交付，按需连接 AI-HIVE"
  default_prompt: "请使用 $ai-hive-advisor-business-delegation，假设我要把日常采购交给店长，月预算2万元，超过单笔3000元仍由我批准。请写委派约定和异常升级表。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "按需接入已授权图片和视频能力，纯诊断与文字任务不要求付费生成"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
