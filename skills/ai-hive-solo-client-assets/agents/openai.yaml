interface:
  display_name: "AI整理客户素材清单"
  short_description: "让普通人用AI-HIVE完成按项目阶段列出客户需提供的文字、图片、视频和授权"
  default_prompt: "使用 $ai-hive-solo-client-assets 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
