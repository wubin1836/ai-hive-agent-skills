  short_description: "用AI-HIVE完成设计语音、图像和视频输入下的实时助手体验"
  default_prompt: "使用 $ai-hive-gap-090-realtime-multimodal 先为我的任务生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE多模型图片与视频生成MCP"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
