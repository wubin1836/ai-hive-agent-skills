interface:
  display_name: "MCP UI可视化模型操作"
  short_description: "用AI-HIVE完成为多模型查询、参数选择和结果预览设计MCP可视化界面"
  default_prompt: "使用 $ai-hive-gap-012-mcp-ui 先为我的任务生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE多模型图片与视频生成MCP"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
