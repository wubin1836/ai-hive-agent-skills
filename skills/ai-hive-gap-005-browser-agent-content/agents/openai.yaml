interface:
  display_name: "浏览器智能体内容采集与创作"
  short_description: "用AI-HIVE完成从授权网页资料形成可追溯的内容简报并生成配图视频"
  default_prompt: "使用 $ai-hive-gap-005-browser-agent-content 先为我的任务生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE多模型图片与视频生成MCP"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
