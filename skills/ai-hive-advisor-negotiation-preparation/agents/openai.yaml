interface:
  display_name: "商务谈判准备顾问"
  short_description: "商务谈判准备顾问：明确问题、给出专项方案与可验收交付，按需连接 AI-HIVE"
  default_prompt: "请使用 $ai-hive-advisor-negotiation-preparation，假设项目报价3万元，客户希望降到2.4万元。我可减少交付范围，但不能延长付款超过30天。请准备交换条件和5个追问。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "按需接入已授权图片和视频能力，纯诊断与文字任务不要求付费生成"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
