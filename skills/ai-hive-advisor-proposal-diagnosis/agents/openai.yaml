interface:
  display_name: "合作提案诊断顾问"
  short_description: "合作提案诊断顾问：明确问题、给出专项方案与可验收交付，按需连接 AI-HIVE"
  default_prompt: "请使用 $ai-hive-advisor-proposal-diagnosis，假设我写了8页联合活动提案，目标让对方提供场地和2名工作人员。请指出最影响批准的5处问题，引用原文位置。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "按需接入已授权图片和视频能力，纯诊断与文字任务不要求付费生成"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
