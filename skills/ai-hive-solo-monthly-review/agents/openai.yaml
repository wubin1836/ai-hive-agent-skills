interface:
  display_name: "AI制作自由职业月度复盘"
  short_description: "让普通人用AI-HIVE完成汇总线索、成交、交付、回款与时间投入，找出下月一个改进重点"
  default_prompt: "使用 $ai-hive-solo-monthly-review 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
