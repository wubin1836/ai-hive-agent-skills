interface:
  display_name: "AI制作知识点记忆卡"
  short_description: "让普通人用AI-HIVE完成把资料转换成一问一答、概念对比和例子卡片并保留来源"
  default_prompt: "使用 $ai-hive-life-memory-cards 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
