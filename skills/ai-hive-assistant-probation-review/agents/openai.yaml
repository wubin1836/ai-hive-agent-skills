interface:
  display_name: "转正述职助手"
  short_description: "转正述职助手：围绕实际输入完成专项工作，按需接入 AI-HIVE 图视频能力"
  default_prompt: "请使用 $ai-hive-assistant-probation-review，按这四个试用期目标准备转正汇报，第三项只完成了一半，要如实写。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "按需调用 AI-HIVE 的已授权图片与视频能力；纯办公任务不要求媒体生成"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
