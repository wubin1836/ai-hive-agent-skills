interface:
  display_name: "AI穿搭效果预览"
  short_description: "让普通人用AI-HIVE完成根据已有服装和使用场景制作穿搭组合与视觉预览，不虚构尺码适配"
  default_prompt: "使用 $ai-hive-life-outfit-preview 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
