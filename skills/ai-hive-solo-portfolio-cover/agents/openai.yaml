interface:
  display_name: "AI制作作品集封面"
  short_description: "让普通人用AI-HIVE完成让封面清楚表达专业方向、目标客户和作品类型"
  default_prompt: "使用 $ai-hive-solo-portfolio-cover 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
