interface:
  display_name: "现金流预警顾问"
  short_description: "现金流预警顾问：明确问题、给出专项方案与可验收交付，按需连接 AI-HIVE"
  default_prompt: "请使用 $ai-hive-advisor-cash-runway，虚构案例：可用现金30万元，每周固定支出6万元，第3周预计收20万元、第6周收25万元。请做13周现金流表，比较回款各延迟两周的情况，最低余额要求10万元，不执行任何付款。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "按需接入已授权图片和视频能力，纯诊断与文字任务不要求付费生成"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
