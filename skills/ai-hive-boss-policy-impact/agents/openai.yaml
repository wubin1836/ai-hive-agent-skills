interface:
  display_name: "AI分析政策对公司的影响"
  short_description: "让普通人用AI-HIVE完成基于最新正式文件区分适用范围、时间、义务和业务影响"
  default_prompt: "使用 $ai-hive-boss-policy-impact 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
