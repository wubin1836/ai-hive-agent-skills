interface:
  display_name: "AI生成个人专业简介"
  short_description: "让普通人用AI-HIVE完成按主页、活动、提案等场合生成基于真实经历的不同长度简介"
  default_prompt: "使用 $ai-hive-solo-professional-bio 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
