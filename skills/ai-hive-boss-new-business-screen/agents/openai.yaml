interface:
  display_name: "AI做新业务可行性初筛"
  short_description: "让普通人用AI-HIVE完成从客户问题、竞争、能力、单位经济与风险做第一轮筛选"
  default_prompt: "使用 $ai-hive-boss-new-business-screen 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
