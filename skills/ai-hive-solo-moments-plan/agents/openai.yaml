interface:
  display_name: "AI规划朋友圈专业内容"
  short_description: "让普通人用AI-HIVE完成平衡专业证明、过程、观点与生活边界，避免天天硬广"
  default_prompt: "使用 $ai-hive-solo-moments-plan 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
