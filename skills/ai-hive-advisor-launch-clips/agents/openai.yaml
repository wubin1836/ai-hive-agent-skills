interface:
  display_name: "发布会切片顾问"
  short_description: "发布会切片顾问：明确问题、给出专项方案与可验收交付，按需连接 AI-HIVE"
  default_prompt: "请使用 $ai-hive-advisor-launch-clips，这场发布会讲三款软件，只有A已上线，选6条切片，B和C要标内测。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "按需接入已授权图片和视频能力，纯诊断与文字任务不要求付费生成"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
