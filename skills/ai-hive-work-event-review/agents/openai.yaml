interface:
  display_name: "AI生成活动复盘"
  short_description: "让普通人用AI-HIVE完成按目标、参与、转化、成本和反馈复盘，不只罗列数据"
  default_prompt: "使用 $ai-hive-work-event-review 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
