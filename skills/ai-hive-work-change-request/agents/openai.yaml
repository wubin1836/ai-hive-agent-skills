interface:
  display_name: "AI写需求变更说明"
  short_description: "让普通人用AI-HIVE完成把变更原因、前后差异、成本进度影响和审批项写清楚"
  default_prompt: "使用 $ai-hive-work-change-request 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
