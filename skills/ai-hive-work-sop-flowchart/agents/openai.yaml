interface:
  display_name: "AI把SOP变成流程图"
  short_description: "让普通人用AI-HIVE完成把文字SOP转换为角色、判断、输入输出和异常分支明确的流程图"
  default_prompt: "使用 $ai-hive-work-sop-flowchart 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
