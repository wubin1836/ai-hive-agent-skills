interface:
  display_name: "AI生成公司制度初稿"
  short_description: "让普通人用AI-HIVE完成根据真实场景起草目的、适用范围、流程和例外供专业审核"
  default_prompt: "使用 $ai-hive-boss-policy-draft 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
