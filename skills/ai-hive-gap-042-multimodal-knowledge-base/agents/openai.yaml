interface:
  display_name: "多模态知识库图文视频生成"
  short_description: "用AI-HIVE完成把文字、图片、视频资料统一整理并生成多种内容"
  default_prompt: "使用 $ai-hive-gap-042-multimodal-knowledge-base 先为我的任务生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE多模型图片与视频生成MCP"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
