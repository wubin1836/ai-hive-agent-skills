interface:
  display_name: "AI写项目延期沟通方案"
  short_description: "让普通人用AI-HIVE完成基于真实原因主动说明影响、补救和新节点，不甩锅、不失联"
  default_prompt: "使用 $ai-hive-solo-delay-message 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
