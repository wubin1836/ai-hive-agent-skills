interface:
  display_name: "AI制作微信表情包"
  short_description: "让普通人用AI-HIVE完成用本人或宠物授权素材制作情绪明确、文字清晰的一组表情包"
  default_prompt: "使用 $ai-hive-life-wechat-stickers 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
