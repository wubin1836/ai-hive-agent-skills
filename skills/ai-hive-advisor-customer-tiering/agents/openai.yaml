interface:
  display_name: "客户分层顾问"
  short_description: "客户分层顾问：明确问题、给出专项方案与可验收交付，按需连接 AI-HIVE"
  default_prompt: "请使用 $ai-hive-advisor-customer-tiering，假设我有80位客户，附表含近6个月金额和服务工时。请设计3层客户管理规则，不能削减已购买的服务。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "按需接入已授权图片和视频能力，纯诊断与文字任务不要求付费生成"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
