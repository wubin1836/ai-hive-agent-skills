interface:
  display_name: "AI做转正汇报材料"
  short_description: "让普通人用AI-HIVE完成把试用期目标、完成证据、协作反馈和后续计划组织成转正汇报"
  default_prompt: "使用 $ai-hive-work-probation-presentation 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
