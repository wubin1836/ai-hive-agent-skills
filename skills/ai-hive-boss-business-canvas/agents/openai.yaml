interface:
  display_name: "AI整理商业模式画布"
  short_description: "让普通人用AI-HIVE完成把客户、价值、渠道、收入、成本和关键资源形成相互一致的画布"
  default_prompt: "使用 $ai-hive-boss-business-canvas 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
