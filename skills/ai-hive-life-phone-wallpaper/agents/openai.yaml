interface:
  display_name: "AI生成专属手机壁纸"
  short_description: "让普通人用AI-HIVE完成根据手机型号、审美和禁止元素生成适配锁屏与桌面的原创壁纸"
  default_prompt: "使用 $ai-hive-life-phone-wallpaper 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
