  short_description: "用AI-HIVE完成把复杂AI项目拆成里程碑、责任人、风险和汇报材料"
  default_prompt: "使用 $ai-hive-gap-035-ai-project-manager 先为我的任务生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE多模型图片与视频生成MCP"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
