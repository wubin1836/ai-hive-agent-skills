interface:
  display_name: "AI生成销售角色陪练"
  short_description: "让普通人用AI-HIVE完成模拟不同类型客户与异议，让销售在安全环境中练习并获得证据化反馈"
  default_prompt: "使用 $ai-hive-boss-sales-roleplay 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
