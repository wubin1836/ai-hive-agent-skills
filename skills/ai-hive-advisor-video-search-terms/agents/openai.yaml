interface:
  display_name: "视频搜索词顾问"
  short_description: "视频搜索词顾问：明确问题、给出专项方案与可验收交付，按需连接 AI-HIVE"
  default_prompt: "请使用 $ai-hive-advisor-video-search-terms，用这50条匿名客服提问，为门店排班软件整理20个视频搜索问题，没有搜索热度数据。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "按需接入已授权图片和视频能力，纯诊断与文字任务不要求付费生成"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
