interface:
  display_name: "AI生成合规证件照"
  short_description: "让普通人用AI-HIVE完成根据用途生成尺寸、背景和着装合规的证件照候选，不擅自改变身份特征"
  default_prompt: "使用 $ai-hive-life-id-photo 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
