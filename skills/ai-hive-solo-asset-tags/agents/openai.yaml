interface:
  display_name: "AI整理个人素材库标签"
  short_description: "让普通人用AI-HIVE完成建立主题、人物、授权、平台、状态和复用价值一致的标签"
  default_prompt: "使用 $ai-hive-solo-asset-tags 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
