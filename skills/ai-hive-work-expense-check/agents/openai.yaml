interface:
  display_name: "AI核对发票报销材料"
  short_description: "让普通人用AI-HIVE完成按用户提供的制度核对发票、金额、事由和附件是否齐全"
  default_prompt: "使用 $ai-hive-work-expense-check 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
