interface:
  display_name: "客户投诉升级顾问"
  short_description: "客户投诉升级顾问：明确问题、给出专项方案与可验收交付，按需连接 AI-HIVE"
  default_prompt: "请使用 $ai-hive-advisor-complaint-escalation，客户退款投诉在销售和客服间转了三次，用这些记录列老板该拍板的事项，别直接承诺赔偿。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "按需接入已授权图片和视频能力，纯诊断与文字任务不要求付费生成"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
