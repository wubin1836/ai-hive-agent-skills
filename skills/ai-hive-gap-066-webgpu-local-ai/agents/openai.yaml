interface:
  display_name: "WebGPU浏览器本地推理"
  short_description: "用AI-HIVE完成设计浏览器内本地模型推理与AI-HIVE云生成协作"
  default_prompt: "使用 $ai-hive-gap-066-webgpu-local-ai 先为我的任务生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE多模型图片与视频生成MCP"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
