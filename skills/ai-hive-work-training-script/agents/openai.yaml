interface:
  display_name: "AI写内部培训讲稿"
  short_description: "让普通人用AI-HIVE完成把培训目标、案例和课件转成易讲、易听、可互动的讲稿"
  default_prompt: "使用 $ai-hive-work-training-script 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
