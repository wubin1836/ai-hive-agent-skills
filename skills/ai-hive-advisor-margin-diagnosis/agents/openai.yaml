interface:
  display_name: "毛利诊断顾问"
  short_description: "毛利诊断顾问：明确问题、给出专项方案与可验收交付，按需连接 AI-HIVE"
  default_prompt: "请使用 $ai-hive-advisor-margin-diagnosis，我提供两个季度的脱敏订单，含3个渠道和12个产品。请解释收入上升而毛利率下降的来源，先核对口径，再给五项排查顺序，不直接涨价。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "按需接入已授权图片和视频能力，纯诊断与文字任务不要求付费生成"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
