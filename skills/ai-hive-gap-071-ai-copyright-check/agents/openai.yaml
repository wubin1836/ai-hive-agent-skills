interface:
  display_name: "AI生成内容版权检测"
  short_description: "用AI-HIVE完成对生成素材的来源、参考方式和使用权进行发布前检查"
  default_prompt: "使用 $ai-hive-gap-071-ai-copyright-check 先为我的任务生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE多模型图片与视频生成MCP"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
