interface:
  display_name: "折扣审批顾问"
  short_description: "折扣审批顾问：明确问题、给出专项方案与可验收交付，按需连接 AI-HIVE"
  default_prompt: "请使用 $ai-hive-advisor-discount-review，虚构案例：原报价10万元、直接交付成本6万元，客户要九折且延后60天付款。请比较条件并列三个待确认问题，不替我批准。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "按需接入已授权图片和视频能力，纯诊断与文字任务不要求付费生成"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
