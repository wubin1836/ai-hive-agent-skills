interface:
  display_name: "AI BI经营洞察图文报告"
  short_description: "用AI-HIVE完成把业务数据、问题和行动建议组织成图文洞察报告"
  default_prompt: "使用 $ai-hive-gap-026-ai-bi-insight 先为我的任务生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE多模型图片与视频生成MCP"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
