interface:
  display_name: "AI制作接单主页封面"
  short_description: "让普通人用AI-HIVE完成把核心服务、适合客户与信任信息放进移动端易读的主页封面"
  default_prompt: "使用 $ai-hive-solo-profile-cover 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
