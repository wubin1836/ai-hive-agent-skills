interface:
  display_name: "多模型故障转移"
  short_description: "用AI-HIVE完成处理超时、限流、不可用和任务状态未知的故障转移"
  default_prompt: "使用 $ai-hive-gap-062-model-failover 先为我的任务生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE多模型图片与视频生成MCP"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
