interface:
  display_name: "AI跟踪公司重点事项"
  short_description: "让普通人用AI-HIVE完成把重点事项的目标、里程碑、阻塞和需要升级的问题集中管理"
  default_prompt: "使用 $ai-hive-boss-company-priorities 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
