interface:
  display_name: "AI制作租房看房对比表"
  short_description: "让普通人用AI-HIVE完成按通勤、费用、合同与生活需求比较用户提供的房源，不替代实地核验"
  default_prompt: "使用 $ai-hive-life-rental-comparison 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
