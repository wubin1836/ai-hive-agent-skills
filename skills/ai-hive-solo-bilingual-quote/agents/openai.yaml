interface:
  display_name: "AI生成中英双语报价"
  short_description: "让普通人用AI-HIVE完成让中英文报价的范围、金额、税费和交付表述一致"
  default_prompt: "使用 $ai-hive-solo-bilingual-quote 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
