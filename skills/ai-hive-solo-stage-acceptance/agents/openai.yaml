interface:
  display_name: "AI写阶段验收提醒"
  short_description: "让普通人用AI-HIVE完成在进入下一阶段前提醒客户按既定标准确认并记录反馈"
  default_prompt: "使用 $ai-hive-solo-stage-acceptance 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
