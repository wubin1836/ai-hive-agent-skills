interface:
  display_name: "AI翻译并保留原文语气"
  short_description: "让普通人用AI-HIVE完成在准确传意基础上保留正式、幽默或克制等原文语气"
  default_prompt: "使用 $ai-hive-life-tone-preserving-translation 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
