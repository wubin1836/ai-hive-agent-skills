interface:
  display_name: "AI写问题复盘五个为什么"
  short_description: "让普通人用AI-HIVE完成用证据逐层追问原因，避免把最后原因简单归咎个人"
  default_prompt: "使用 $ai-hive-work-five-whys 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
