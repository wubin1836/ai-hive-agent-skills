interface:
  display_name: "AI生成跟单提醒和话术"
  short_description: "让普通人用AI-HIVE完成根据客户阶段、承诺和未决问题生成有上下文的跟进任务与草稿"
  default_prompt: "使用 $ai-hive-boss-followup-reminder 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
