interface:
  display_name: "专家咨询准备顾问"
  short_description: "专家咨询准备顾问：明确问题、给出专项方案与可验收交付，按需连接 AI-HIVE"
  default_prompt: "请使用 $ai-hive-advisor-expert-consult-preparation，假设我约了30分钟律师咨询，涉及一份服务合同和6次沟通。请按我给的日期整理摘要和5个优先问题，不判断我是否一定胜诉。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "按需接入已授权图片和视频能力，纯诊断与文字任务不要求付费生成"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
