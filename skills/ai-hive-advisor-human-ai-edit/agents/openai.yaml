interface:
  display_name: "真人与AI混剪顾问"
  short_description: "真人与AI混剪顾问：明确问题、给出专项方案与可验收交付，按需连接 AI-HIVE"
  default_prompt: "请使用 $ai-hive-advisor-human-ai-edit，我有90秒库存口播，想加3段AI仓库示意，不要让人以为是客户仓库，先给混剪方案。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "按需接入已授权图片和视频能力，纯诊断与文字任务不要求付费生成"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
