interface:
  display_name: "AI制作健身动作打卡卡片"
  short_description: "让普通人用AI-HIVE完成把用户已确认的训练安排制作成动作清晰、可记录的打卡卡片"
  default_prompt: "使用 $ai-hive-life-workout-cards 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
