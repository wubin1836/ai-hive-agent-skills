interface:
  display_name: "AI安排一周工作计划"
  short_description: "让普通人用AI-HIVE完成根据会议、截止和精力安排现实可执行的工作块与缓冲"
  default_prompt: "使用 $ai-hive-work-week-plan 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
