interface:
  display_name: "AI翻译海外客户需求"
  short_description: "让普通人用AI-HIVE完成保留范围、时间、质量和商务含义，标出有歧义的需求"
  default_prompt: "使用 $ai-hive-solo-overseas-brief 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
