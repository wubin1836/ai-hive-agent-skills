interface:
  display_name: "AI整理董事会材料"
  short_description: "让普通人用AI-HIVE完成把经营、财务、风险和重大决策组织成来源明确的董事会包"
  default_prompt: "使用 $ai-hive-boss-board-pack 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
