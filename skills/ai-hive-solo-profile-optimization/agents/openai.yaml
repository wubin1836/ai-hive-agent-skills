interface:
  display_name: "AI优化接单平台个人主页"
  short_description: "让普通人用AI-HIVE完成根据真实案例和能力优化主页标题、介绍、作品顺序与信任信息"
  default_prompt: "使用 $ai-hive-solo-profile-optimization 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
