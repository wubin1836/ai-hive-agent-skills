interface:
  display_name: "AI修复老照片并自然上色"
  short_description: "让普通人用AI-HIVE完成修复划痕、褪色和模糊，同时尽量保留人物原貌与年代感"
  default_prompt: "使用 $ai-hive-life-old-photo-restoration 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
