interface:
  display_name: "AI把论文讲给普通人听"
  short_description: "让普通人用AI-HIVE完成区分论文原结论与解释性比喻，把研究问题、方法和限制讲明白"
  default_prompt: "使用 $ai-hive-life-paper-plain-language 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
