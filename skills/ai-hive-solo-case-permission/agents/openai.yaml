interface:
  display_name: "AI规划案例发布授权"
  short_description: "让普通人用AI-HIVE完成确定客户名称、素材、数据、渠道和期限能公开到什么程度"
  default_prompt: "使用 $ai-hive-solo-case-permission 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
