interface:
  display_name: "AI生成工作优先级清单"
  short_description: "让普通人用AI-HIVE完成按影响、截止、依赖和投入排序，并显式标出取舍"
  default_prompt: "使用 $ai-hive-work-priority-list 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
