interface:
  display_name: "AI生成绩效校准材料"
  short_description: "让普通人用AI-HIVE完成整理已确认事实、口径差异和待讨论点，不替代管理者评价"
  default_prompt: "使用 $ai-hive-boss-performance-calibration 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
