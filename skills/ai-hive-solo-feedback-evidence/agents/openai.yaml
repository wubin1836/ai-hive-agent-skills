interface:
  display_name: "AI把客户反馈变成案例证据"
  short_description: "让普通人用AI-HIVE完成把分散反馈与可核数据整理成有出处、不夸大的案例证据"
  default_prompt: "使用 $ai-hive-solo-feedback-evidence 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
