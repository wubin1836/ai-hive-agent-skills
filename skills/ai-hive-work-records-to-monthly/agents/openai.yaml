interface:
  display_name: "AI把工作记录变成月报"
  short_description: "让普通人用AI-HIVE完成从日历、任务和聊天记录提炼当月真实工作，不用空话填充"
  default_prompt: "使用 $ai-hive-work-records-to-monthly 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
