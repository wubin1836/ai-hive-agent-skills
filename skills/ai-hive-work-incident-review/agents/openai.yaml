interface:
  display_name: "AI写故障复盘报告"
  short_description: "让普通人用AI-HIVE完成按时间线、影响、发现、响应和根因整理无责复盘材料"
  default_prompt: "使用 $ai-hive-work-incident-review 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
