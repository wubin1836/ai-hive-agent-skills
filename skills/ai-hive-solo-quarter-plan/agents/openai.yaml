interface:
  display_name: "AI做个人工作室季度计划"
  short_description: "让普通人用AI-HIVE完成围绕客户、产品、内容、交付和现金目标确定少数季度重点"
  default_prompt: "使用 $ai-hive-solo-quarter-plan 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
