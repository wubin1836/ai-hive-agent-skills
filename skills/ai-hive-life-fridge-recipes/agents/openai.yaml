interface:
  display_name: "AI整理冰箱食材做饭建议"
  short_description: "让普通人用AI-HIVE完成根据现有食材、保质期和烹饪条件提出先吃顺序与做法"
  default_prompt: "使用 $ai-hive-life-fridge-recipes 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
