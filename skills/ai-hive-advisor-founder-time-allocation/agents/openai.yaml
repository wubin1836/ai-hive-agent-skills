interface:
  display_name: "创始人时间分配顾问"
  short_description: "创始人时间分配顾问：明确问题、给出专项方案与可验收交付，按需连接 AI-HIVE"
  default_prompt: "请使用 $ai-hive-advisor-founder-time-allocation，假设我每周工作45小时，附有过去10天记录，希望每周留8小时见关键客户，周三晚不工作。请给时间分配建议。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "按需接入已授权图片和视频能力，纯诊断与文字任务不要求付费生成"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
