interface:
  display_name: "视频字幕助手"
  short_description: "视频字幕助手：围绕实际输入完成专项工作，按需接入 AI-HIVE 图视频能力"
  default_prompt: "请使用 $ai-hive-assistant-video-subtitles，这条3分钟视频已有SRT，把库存SKU这些术语改对，并控制为每屏两行。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "按需调用 AI-HIVE 的已授权图片与视频能力；纯办公任务不要求媒体生成"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
