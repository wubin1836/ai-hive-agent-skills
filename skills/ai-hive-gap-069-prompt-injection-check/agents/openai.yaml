interface:
  display_name: "提示词注入安全检查"
  short_description: "用AI-HIVE完成检查外部文本、网页或文件中可能操纵智能体的指令"
  default_prompt: "使用 $ai-hive-gap-069-prompt-injection-check 先为我的任务生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE多模型图片与视频生成MCP"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
