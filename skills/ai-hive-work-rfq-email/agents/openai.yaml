interface:
  display_name: "AI写采购询价邮件"
  short_description: "让普通人用AI-HIVE完成把规格、数量、交期、报价口径和回复日期写清楚"
  default_prompt: "使用 $ai-hive-work-rfq-email 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
