interface:
  display_name: "AI润色公文材料"
  short_description: "让普通人用AI-HIVE完成在不改动事实与政策含义的前提下优化结构、语气和格式"
  default_prompt: "使用 $ai-hive-work-official-document 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
