interface:
  display_name: "渠道合作顾问"
  short_description: "渠道合作顾问：明确问题、给出专项方案与可验收交付，按需连接 AI-HIVE"
  default_prompt: "请使用 $ai-hive-advisor-channel-collaboration，假设摄影店要与1家婚礼策划公司试合作30天，最多接5单。请梳理线索转交、客户沟通和退单时的分成确认问题。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "按需接入已授权图片和视频能力，纯诊断与文字任务不要求付费生成"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
