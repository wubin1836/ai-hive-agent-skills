interface:
  display_name: "项目工时估算顾问"
  short_description: "项目工时估算顾问：明确问题、给出专项方案与可验收交付，按需连接 AI-HIVE"
  default_prompt: "请使用 $ai-hive-advisor-project-effort-estimation，假设要设计10页演示稿，内容已定但图表需重做2页，允许2轮修改。请基于我提供的旧项目工时估算投入，每天只可做3小时。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "按需接入已授权图片和视频能力，纯诊断与文字任务不要求付费生成"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
