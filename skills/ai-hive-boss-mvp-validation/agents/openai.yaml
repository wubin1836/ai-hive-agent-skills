interface:
  display_name: "AI制定MVP验证计划"
  short_description: "让普通人用AI-HIVE完成用最小投入验证最危险假设，不把做完整产品当验证"
  default_prompt: "使用 $ai-hive-boss-mvp-validation 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
