interface:
  display_name: "AI写礼貌催款提醒"
  short_description: "让普通人用AI-HIVE完成根据合同节点生成从温和提醒到正式通知的分级沟通文本"
  default_prompt: "使用 $ai-hive-solo-payment-reminder 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
