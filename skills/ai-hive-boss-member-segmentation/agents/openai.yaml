interface:
  display_name: "AI做会员分层运营方案"
  short_description: "让普通人用AI-HIVE完成用可获得的数据划分会员层级，并为每层定义权益、内容和升级条件"
  default_prompt: "使用 $ai-hive-boss-member-segmentation 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
