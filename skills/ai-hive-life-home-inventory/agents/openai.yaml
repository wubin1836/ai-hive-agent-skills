interface:
  display_name: "AI整理家中物品清单"
  short_description: "让普通人用AI-HIVE完成从照片或记录中按房间、类别和状态建立可更新的家庭物品清单"
  default_prompt: "使用 $ai-hive-life-home-inventory 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
