interface:
  display_name: "AI检查投标材料缺项"
  short_description: "让普通人用AI-HIVE完成按招标要求逐项核对材料存在性、版本、签章和响应位置"
  default_prompt: "使用 $ai-hive-work-bid-completeness 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
