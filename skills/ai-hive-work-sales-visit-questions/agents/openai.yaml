interface:
  display_name: "AI生成销售拜访问题"
  short_description: "让普通人用AI-HIVE完成根据客户阶段设计能了解现状、影响、决策和成功标准的问题"
  default_prompt: "使用 $ai-hive-work-sales-visit-questions 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
