interface:
  display_name: "AI准备路演问答"
  short_description: "让普通人用AI-HIVE完成从投资人视角压力测试市场、壁垒、增长、财务与风险回答"
  default_prompt: "使用 $ai-hive-boss-roadshow-qa 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
