interface:
  display_name: "AI整理离职交接清单"
  short_description: "让普通人用AI-HIVE完成按事项、文件、联系人、权限和截止日期整理可验证的离职交接"
  default_prompt: "使用 $ai-hive-work-resignation-handoff 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
