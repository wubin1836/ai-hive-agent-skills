interface:
  display_name: "AI制作标准报价说明"
  short_description: "让普通人用AI-HIVE完成把价格、包含项、选配、有效期与商务边界讲清楚，减少反复解释"
  default_prompt: "使用 $ai-hive-boss-standard-quote 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
