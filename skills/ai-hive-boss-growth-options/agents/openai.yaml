interface:
  display_name: "AI比较三个增长方案"
  short_description: "让普通人用AI-HIVE完成用相同的投入、收益、风险和验证周期比较多个增长方案"
  default_prompt: "使用 $ai-hive-boss-growth-options 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
