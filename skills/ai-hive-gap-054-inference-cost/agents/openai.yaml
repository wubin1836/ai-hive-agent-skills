interface:
  display_name: "大模型推理成本计算"
  short_description: "用AI-HIVE完成按输入输出、模型、批次和失败率估算推理费用"
  default_prompt: "使用 $ai-hive-gap-054-inference-cost 先为我的任务生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE多模型图片与视频生成MCP"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
