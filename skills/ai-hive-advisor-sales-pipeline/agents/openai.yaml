interface:
  display_name: "销售管道复盘顾问"
  short_description: "销售管道复盘顾问：明确问题、给出专项方案与可验收交付，按需连接 AI-HIVE"
  default_prompt: "请使用 $ai-hive-advisor-sales-pipeline，我有40条商机，其中12条连续两次推迟签约。请按现有证据分档复盘，给一页老板周会清单，不编造成交概率。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "按需接入已授权图片和视频能力，纯诊断与文字任务不要求付费生成"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
