interface:
  display_name: "世界模型交互式场景创作"
  short_description: "用AI-HIVE完成把世界模型概念转成可交互场景、镜头和验证方案"
  default_prompt: "使用 $ai-hive-gap-081-world-model-scenes 先为我的任务生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE多模型图片与视频生成MCP"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
