interface:
  display_name: "AI生成候选人沟通话术"
  short_description: "让普通人用AI-HIVE完成生成邀约、改期、进展与拒绝等尊重候选人的沟通草稿"
  default_prompt: "使用 $ai-hive-work-candidate-message 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
