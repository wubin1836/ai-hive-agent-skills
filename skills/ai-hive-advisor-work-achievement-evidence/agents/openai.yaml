interface:
  display_name: "职场成果举证顾问"
  short_description: "职场成果举证顾问：明确问题、给出专项方案与可验收交付，按需连接 AI-HIVE"
  default_prompt: "请使用 $ai-hive-advisor-work-achievement-evidence，假设团队把处理时间从5天降到3天，我负责表单改造而非全部流程。请根据分工记录做一张成果证据卡，不写成我独立完成。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "按需接入已授权图片和视频能力，纯诊断与文字任务不要求付费生成"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
