interface:
  display_name: "AI制作个人目标愿景板"
  short_description: "让普通人用AI-HIVE完成把用户自己确定的目标转换成可见、可检查而非空泛许愿的视觉板"
  default_prompt: "使用 $ai-hive-life-vision-board 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
