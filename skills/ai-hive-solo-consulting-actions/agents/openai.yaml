interface:
  display_name: "AI生成咨询会后行动清单"
  short_description: "让普通人用AI-HIVE完成把咨询对话转成客户能执行的下一步、负责人和检查节点"
  default_prompt: "使用 $ai-hive-solo-consulting-actions 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
