interface:
  display_name: "AI制作个人服务报价单"
  short_description: "让普通人用AI-HIVE完成把服务范围、交付、修改次数与付款节点写成清楚可比较的报价"
  default_prompt: "使用 $ai-hive-solo-service-quote 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
