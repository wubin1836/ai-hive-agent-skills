interface:
  display_name: "AI把外语视频做成双语字幕"
  short_description: "让普通人用AI-HIVE完成为有权处理的视频生成时间轴匹配、术语一致的双语字幕"
  default_prompt: "使用 $ai-hive-life-bilingual-subtitles 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
