interface:
  display_name: "AI生成知识付费课程大纲"
  short_description: "让普通人用AI-HIVE完成从学员问题与可验证成果倒推课程模块、练习和交付边界"
  default_prompt: "使用 $ai-hive-solo-course-outline 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
