interface:
  display_name: "AI分析滞销商品原因"
  short_description: "让普通人用AI-HIVE完成从流量、转化、价格、内容、渠道和产品匹配分析滞销"
  default_prompt: "使用 $ai-hive-boss-slow-moving 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
