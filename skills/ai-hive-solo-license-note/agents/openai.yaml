interface:
  display_name: "AI生成作品版权授权说明"
  short_description: "让普通人用AI-HIVE完成把作品使用媒体、地域、期限、改编和署名范围写清楚供双方确认"
  default_prompt: "使用 $ai-hive-solo-license-note 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
