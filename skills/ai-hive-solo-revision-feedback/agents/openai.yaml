interface:
  display_name: "AI整理客户修改意见"
  short_description: "让普通人用AI-HIVE完成合并冲突反馈，区分纠错、偏好变化和新增范围，减少无效返工"
  default_prompt: "使用 $ai-hive-solo-revision-feedback 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
