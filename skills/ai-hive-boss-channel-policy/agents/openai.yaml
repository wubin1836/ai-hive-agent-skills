interface:
  display_name: "AI制作渠道合作政策"
  short_description: "让普通人用AI-HIVE完成写清区域、价格、线索、交付、返利和冲突处理供法务商务复核"
  default_prompt: "使用 $ai-hive-boss-channel-policy 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
