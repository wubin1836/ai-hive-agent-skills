interface:
  display_name: "AI把文字做成有声书"
  short_description: "让普通人用AI-HIVE完成把有权使用的长文拆成章节、旁白与角色声音，形成可持续制作流程"
  default_prompt: "使用 $ai-hive-life-text-audiobook 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
