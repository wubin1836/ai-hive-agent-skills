interface:
  display_name: "AI准备一对一沟通提纲"
  short_description: "让普通人用AI-HIVE完成围绕进展、阻塞、反馈、发展和所需支持准备双向提纲"
  default_prompt: "使用 $ai-hive-work-one-on-one 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
