interface:
  display_name: "AI制作新人入职资料清单"
  short_description: "让普通人用AI-HIVE完成按入职前、第一天、第一周整理资料、权限、培训和联系人"
  default_prompt: "使用 $ai-hive-work-onboarding-docs 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
