interface:
  display_name: "AI生成付费咨询交付报告"
  short_description: "让普通人用AI-HIVE完成把咨询记录转成问题诊断、建议、优先级与双方确认的行动清单"
  default_prompt: "使用 $ai-hive-solo-consulting-report 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
