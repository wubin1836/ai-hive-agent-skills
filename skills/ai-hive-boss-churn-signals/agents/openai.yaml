interface:
  display_name: "AI识别客户流失信号"
  short_description: "让普通人用AI-HIVE完成根据购买、互动与服务记录建立可解释的流失信号和跟进顺序"
  default_prompt: "使用 $ai-hive-boss-churn-signals 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
