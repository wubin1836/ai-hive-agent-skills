interface:
  display_name: "AI生成公司AI工具使用规范"
  short_description: "让普通人用AI-HIVE完成明确可用工具、禁止数据、人工复核、版权和事件上报"
  default_prompt: "使用 $ai-hive-boss-ai-policy 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
