interface:
  display_name: "AI检查需求文档缺项"
  short_description: "让普通人用AI-HIVE完成检查目标、用户、流程、边界、数据和验收是否清楚"
  default_prompt: "使用 $ai-hive-work-prd-check 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
