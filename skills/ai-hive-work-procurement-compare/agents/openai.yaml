interface:
  display_name: "AI做采购比价表"
  short_description: "让普通人用AI-HIVE完成统一规格、税费、交期与服务口径后比较报价"
  default_prompt: "使用 $ai-hive-work-procurement-compare 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
