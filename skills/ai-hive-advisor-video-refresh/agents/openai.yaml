interface:
  display_name: "老视频翻新顾问"
  short_description: "老视频翻新顾问：明确问题、给出专项方案与可验收交付，按需连接 AI-HIVE"
  default_prompt: "请使用 $ai-hive-advisor-video-refresh，这条旧教程软件界面换了，按我提供的新录屏判断哪些保留、哪些必须重拍。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "按需接入已授权图片和视频能力，纯诊断与文字任务不要求付费生成"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
