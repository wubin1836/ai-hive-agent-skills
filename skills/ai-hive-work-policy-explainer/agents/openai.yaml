interface:
  display_name: "AI把制度文件讲明白"
  short_description: "让普通人用AI-HIVE完成把制度条款转成角色化问答、场景案例和办理步骤，不替代正式文本"
  default_prompt: "使用 $ai-hive-work-policy-explainer 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
