interface:
  display_name: "AI分析团队能力缺口"
  short_description: "让普通人用AI-HIVE完成从业务目标和关键任务识别团队缺口，不自动评价个人"
  default_prompt: "使用 $ai-hive-boss-team-gap 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
