interface:
  display_name: "AI对比合同修改内容"
  short_description: "让普通人用AI-HIVE完成对比合同版本的权利义务、金额、期限和责任变化，供专业人员复核"
  default_prompt: "使用 $ai-hive-work-contract-redline 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
