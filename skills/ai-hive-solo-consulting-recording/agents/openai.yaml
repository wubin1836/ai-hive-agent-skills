interface:
  display_name: "AI制作线上咨询录屏说明"
  short_description: "让普通人用AI-HIVE完成把咨询结论和操作步骤制作成客户能回看的录屏脚本"
  default_prompt: "使用 $ai-hive-solo-consulting-recording 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
