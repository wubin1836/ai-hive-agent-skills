interface:
  display_name: "AI制作口播字幕与配图"
  short_description: "让普通人用AI-HIVE完成根据口播语义安排字幕层级、关键词强调与必要配图，避免画面喧宾夺主"
  default_prompt: "使用 $ai-hive-solo-caption-visuals 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
