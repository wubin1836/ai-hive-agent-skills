interface:
  display_name: "AI制作每周内容排期"
  short_description: "让普通人用AI-HIVE完成根据可用时间、栏目和素材库存安排现实可执行的一周内容"
  default_prompt: "使用 $ai-hive-solo-week-content-calendar 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
