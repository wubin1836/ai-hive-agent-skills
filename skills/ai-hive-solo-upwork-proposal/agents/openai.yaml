interface:
  display_name: "AI制作Upwork投标提案"
  short_description: "让普通人用AI-HIVE完成针对具体职位说明写有证据、不过度复制模板的投标提案"
  default_prompt: "使用 $ai-hive-solo-upwork-proposal 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
