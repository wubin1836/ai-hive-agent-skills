interface:
  display_name: "AI生成接单服务介绍"
  short_description: "让普通人用AI-HIVE完成把一项能力包装成客户看得懂的服务项目，而不是空泛个人介绍"
  default_prompt: "使用 $ai-hive-solo-service-listing 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
