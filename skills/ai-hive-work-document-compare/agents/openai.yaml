interface:
  display_name: "AI对比多个版本文档"
  short_description: "让普通人用AI-HIVE完成区分新增、删除、口径变化和相互矛盾的信息并给出位置"
  default_prompt: "使用 $ai-hive-work-document-compare 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
