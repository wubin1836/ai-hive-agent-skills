interface:
  display_name: "AI制作加盟商培训材料"
  short_description: "让普通人用AI-HIVE完成把品牌标准、开业流程、运营动作与考核要求转成易学培训内容"
  default_prompt: "使用 $ai-hive-boss-franchise-training 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
