  short_description: "让普通人用AI-HIVE完成把服务定位、联系方式和二维码做成移动端易扫的名片海报"
  default_prompt: "使用 $ai-hive-solo-qr-business-card 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
