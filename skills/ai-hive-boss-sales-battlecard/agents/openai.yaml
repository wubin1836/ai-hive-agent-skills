  short_description: "让普通人用AI-HIVE完成把真实成交、过程亮点和可复用经验做成不泄露客户隐私的战报"
  default_prompt: "使用 $ai-hive-boss-sales-battlecard 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
