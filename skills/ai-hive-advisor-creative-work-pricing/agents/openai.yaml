interface:
  display_name: "个人作品定价顾问"
  short_description: "个人作品定价顾问：明确问题、给出专项方案与可验收交付，按需连接 AI-HIVE"
  default_prompt: "请使用 $ai-hive-advisor-creative-work-pricing，假设我有一幅原创插画，制作12小时。客户想用于一次线上活动或全年品牌宣传，请基于附上的3笔参考交易比较报价条件，不编市场均价。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "按需接入已授权图片和视频能力，纯诊断与文字任务不要求付费生成"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
