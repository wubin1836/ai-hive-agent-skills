interface:
  display_name: "AI写项目发言稿"
  short_description: "让普通人用AI-HIVE完成用真实项目事实写出适合特定场合和时长的发言，不冒充领导观点"
  default_prompt: "使用 $ai-hive-work-project-speech 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
