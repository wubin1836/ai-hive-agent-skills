interface:
  display_name: "套餐组合顾问"
  short_description: "套餐组合顾问：明确问题、给出专项方案与可验收交付，按需连接 AI-HIVE"
  default_prompt: "请使用 $ai-hive-advisor-package-architecture，假设我有拍摄、修图、妆造等7个收费项，附成本表。请设计最多3种套餐，每种明确照片数量和适合的人。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "按需接入已授权图片和视频能力，纯诊断与文字任务不要求付费生成"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
