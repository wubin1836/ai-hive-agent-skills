interface:
  display_name: "AI快速读懂PDF文件"
  short_description: "让普通人用AI-HIVE完成按问题定位PDF中的关键事实、表格、限制和待行动事项"
  default_prompt: "使用 $ai-hive-work-pdf-fast-read 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
