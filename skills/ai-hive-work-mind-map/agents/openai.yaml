interface:
  display_name: "AI把资料变成思维导图"
  short_description: "让普通人用AI-HIVE完成按问题层级而非原文顺序重组资料，并保留原文证据位置"
  default_prompt: "使用 $ai-hive-work-mind-map 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
