interface:
  display_name: "AI生成Excel公式"
  short_description: "让普通人用AI-HIVE完成根据字段、样例和期望结果生成可复制公式并解释边界条件"
  default_prompt: "使用 $ai-hive-work-excel-formula 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
