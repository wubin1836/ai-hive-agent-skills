interface:
  display_name: "AI把会议结论做成一张图"
  short_description: "让普通人用AI-HIVE完成把会议决定、原因、负责人和日期制作成团队一眼能懂的图解"
  default_prompt: "使用 $ai-hive-work-decision-onepager 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
