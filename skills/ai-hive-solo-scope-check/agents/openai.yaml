interface:
  display_name: "AI判断需求是否超出范围"
  short_description: "让普通人用AI-HIVE完成依据已确认工作单判断新请求是否改变交付、周期或成本"
  default_prompt: "使用 $ai-hive-solo-scope-check 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
