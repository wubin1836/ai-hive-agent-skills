interface:
  display_name: "AI制作家庭一周菜谱"
  short_description: "让普通人用AI-HIVE完成根据家庭人数、口味、时间和明确过敏信息安排可复用食材的菜单"
  default_prompt: "使用 $ai-hive-life-weekly-menu 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
