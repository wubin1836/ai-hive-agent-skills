interface:
  display_name: "AI检查客服聊天质量"
  short_description: "让普通人用AI-HIVE完成按统一标准抽查客服对话中的准确性、态度、解决率和合规风险"
  default_prompt: "使用 $ai-hive-boss-customer-service-qa 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
