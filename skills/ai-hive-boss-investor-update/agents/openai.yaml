interface:
  display_name: "AI生成投资人月报"
  short_description: "让普通人用AI-HIVE完成基于真实进展向投资人说明指标、产品、团队、现金和所需帮助"
  default_prompt: "使用 $ai-hive-boss-investor-update 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
