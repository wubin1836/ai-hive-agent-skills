interface:
  display_name: "AI生成管理层会议提问"
  short_description: "让普通人用AI-HIVE完成围绕异常、假设和决策生成能推动结论的问题，而不是泛泛发言"
  default_prompt: "使用 $ai-hive-boss-meeting-questions 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
