interface:
  display_name: "AI生成老板每日经营简报"
  short_description: "让普通人用AI-HIVE完成把销售、客户、交付、现金与异常压缩成老板每天能快速决策的简报"
  default_prompt: "使用 $ai-hive-boss-daily-brief 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
