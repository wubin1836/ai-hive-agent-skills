interface:
  display_name: "AI整理领导口头要求"
  short_description: "让普通人用AI-HIVE完成把口头要求转成目标、交付、时间和未决项，供对方确认"
  default_prompt: "使用 $ai-hive-work-verbal-request 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
