interface:
  display_name: "AI制作微信加好友欢迎语"
  short_description: "让普通人用AI-HIVE完成根据来源和需求生成自然欢迎、资料引导与人工回复预期"
  default_prompt: "使用 $ai-hive-solo-wechat-welcome 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
