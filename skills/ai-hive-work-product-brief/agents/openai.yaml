interface:
  display_name: "AI写产品需求说明"
  short_description: "让普通人用AI-HIVE完成把已确认问题、用户流程、范围和验收写成可评审需求说明"
  default_prompt: "使用 $ai-hive-work-product-brief 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
