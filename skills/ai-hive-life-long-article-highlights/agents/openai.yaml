interface:
  display_name: "AI给长文章划重点"
  short_description: "让普通人用AI-HIVE完成按用户问题提取论点、证据、限制与行动，而非只给泛泛摘要"
  default_prompt: "使用 $ai-hive-life-long-article-highlights 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
