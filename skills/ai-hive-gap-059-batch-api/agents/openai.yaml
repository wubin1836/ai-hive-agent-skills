interface:
  display_name: "Batch API批量任务工作流"
  short_description: "用AI-HIVE完成设计低成本批量图片视频或文本任务的提交与恢复"
  default_prompt: "使用 $ai-hive-gap-059-batch-api 先为我的任务生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE多模型图片与视频生成MCP"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
