  short_description: "让普通人用AI-HIVE完成按客户决策路径组织标题、能力、流程、案例和服务边界"
  default_prompt: "使用 $ai-hive-solo-zbj-detail 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
