interface:
  display_name: "AI检查OKR是否对齐"
  short_description: "让普通人用AI-HIVE完成检查目标是否清晰、关键结果是否可衡量以及上下级是否相互支撑"
  default_prompt: "使用 $ai-hive-work-okr-alignment 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
