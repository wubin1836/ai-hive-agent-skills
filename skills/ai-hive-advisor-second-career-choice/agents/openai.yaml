interface:
  display_name: "第二职业选择顾问"
  short_description: "第二职业选择顾问：明确问题、给出专项方案与可验收交付，按需连接 AI-HIVE"
  default_prompt: "请使用 $ai-hive-advisor-second-career-choice，假设我做财务全职，每周只有6小时，想比较摄影、表格整理和知识写作，试错预算1000元。请选适合先试的方向并解释约束。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "按需接入已授权图片和视频能力，纯诊断与文字任务不要求付费生成"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
