interface:
  display_name: "AI写年终工作总结"
  short_description: "让普通人用AI-HIVE完成从任务记录和数据中整理年度成果、问题、学习与下一年计划"
  default_prompt: "使用 $ai-hive-work-year-end-summary 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
