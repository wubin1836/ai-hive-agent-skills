interface:
  display_name: "AI做转行能力盘点"
  short_description: "让普通人用AI-HIVE完成从经历中提取可迁移能力、证据和差距，形成可验证的转行路线"
  default_prompt: "使用 $ai-hive-life-career-change-audit 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
