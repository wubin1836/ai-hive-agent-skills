interface:
  display_name: "AI准备跨时区项目交付"
  short_description: "让普通人用AI-HIVE完成设计异步更新、重叠时间、反馈截止与紧急联络规则"
  default_prompt: "使用 $ai-hive-solo-timezone-delivery 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
