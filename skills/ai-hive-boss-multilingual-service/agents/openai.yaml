interface:
  display_name: "AI制作多语言客户服务资料"
  short_description: "让普通人用AI-HIVE完成把FAQ、流程和模板本地化为多语言客服资料，并保留原文对应"
  default_prompt: "使用 $ai-hive-boss-multilingual-service 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
