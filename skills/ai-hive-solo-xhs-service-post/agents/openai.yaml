interface:
  display_name: "AI生成小红书接单笔记"
  short_description: "让普通人用AI-HIVE完成把服务能力写成用户问题、解决过程和真实案例型笔记"
  default_prompt: "使用 $ai-hive-solo-xhs-service-post 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
