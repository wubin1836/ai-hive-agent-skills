interface:
  display_name: "经营优先级顾问"
  short_description: "经营优先级顾问：明确问题、给出专项方案与可验收交付，按需连接 AI-HIVE"
  default_prompt: "请使用 $ai-hive-advisor-business-priorities，假设3人团队下月只能投入120小时，待办有官网改版、20位客户回访和新套餐设计。请按附表排顺序，必须保留每周交付。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "按需接入已授权图片和视频能力，纯诊断与文字任务不要求付费生成"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
