interface:
  display_name: "AI写向上汇报摘要"
  short_description: "让普通人用AI-HIVE完成把复杂工作压缩成结论、证据、风险和需要领导决定的事项"
  default_prompt: "使用 $ai-hive-work-upward-summary 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
