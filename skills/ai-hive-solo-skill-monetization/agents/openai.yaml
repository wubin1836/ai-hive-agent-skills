interface:
  display_name: "AI梳理个人技能变现路径"
  short_description: "让普通人用AI-HIVE完成把已有技能、案例和可投入时间映射为低风险的服务或数字产品实验"
  default_prompt: "使用 $ai-hive-solo-skill-monetization 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
