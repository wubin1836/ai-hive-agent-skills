interface:
  display_name: "AI把复杂问题讲给领导"
  short_description: "让普通人用AI-HIVE完成从业务影响出发解释问题、原因、选项和取舍，避免堆术语"
  default_prompt: "使用 $ai-hive-work-explain-complex 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
