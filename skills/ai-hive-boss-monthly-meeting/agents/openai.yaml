interface:
  display_name: "AI生成月度经营会材料"
  short_description: "让普通人用AI-HIVE完成把业务、财务、客户、团队和重点项目组织成经营会材料"
  default_prompt: "使用 $ai-hive-boss-monthly-meeting 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
