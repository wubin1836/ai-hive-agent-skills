interface:
  display_name: "AI让老照片动起来说话"
  short_description: "让普通人用AI-HIVE完成把有权使用的老照片制作成克制自然的短动画或纪念口播"
  default_prompt: "使用 $ai-hive-life-talking-old-photo 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
