interface:
  display_name: "客户改稿边界顾问"
  short_description: "客户改稿边界顾问：明确问题、给出专项方案与可验收交付，按需连接 AI-HIVE"
  default_prompt: "请使用 $ai-hive-advisor-revision-boundaries，假设原确认1张海报、2轮调整，第二轮客户新增易拉宝和朋友圈图。请按附上的确认记录分类，并写一段补范围沟通。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "按需接入已授权图片和视频能力，纯诊断与文字任务不要求付费生成"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
