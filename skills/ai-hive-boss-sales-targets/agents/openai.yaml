interface:
  display_name: "AI拆解销售目标到人到周"
  short_description: "让普通人用AI-HIVE完成从收入目标倒推客单、成交、机会和活动量，并标明假设"
  default_prompt: "使用 $ai-hive-boss-sales-targets 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
