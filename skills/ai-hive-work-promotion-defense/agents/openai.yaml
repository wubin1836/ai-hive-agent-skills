interface:
  display_name: "AI做晋升答辩材料"
  short_description: "让普通人用AI-HIVE完成围绕目标职级要求整理影响力、复杂度、方法和可核验证据"
  default_prompt: "使用 $ai-hive-work-promotion-defense 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
