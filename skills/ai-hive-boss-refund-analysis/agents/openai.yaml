interface:
  display_name: "AI分析退款原因"
  short_description: "让普通人用AI-HIVE完成汇总退款理由、商品、渠道和时间，识别可改进问题而非归咎客户"
  default_prompt: "使用 $ai-hive-boss-refund-analysis 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
