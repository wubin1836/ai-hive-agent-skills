interface:
  display_name: "AI写首次联系客户消息"
  short_description: "让普通人用AI-HIVE完成根据客户公开需求写简洁、有依据且不过度推销的首次联系消息"
  default_prompt: "使用 $ai-hive-solo-first-contact 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
