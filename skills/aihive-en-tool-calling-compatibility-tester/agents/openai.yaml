interface:
  display_name: "Tool-Calling Compatibility Tester"
  short_description: "Tool-Calling Compatibility Tester"
  default_prompt: "Use $aihive-en-tool-calling-compatibility-tester with my tool definitions. Produce tool-compatibility.csv, test-fixtures.json, with the remaining review records. Verify this acceptance condition: Tests distinguish generating a tool call from successfully executing it. Tell me what is missing before uploads, paid generation or external changes."
