interface:
  display_name: "AI制作员工培训地图"
  short_description: "让普通人用AI-HIVE完成从岗位任务和常见错误规划入职、进阶和管理培训"
  default_prompt: "使用 $ai-hive-boss-training-map 先根据我的资料生成不计费工作单，再查询AI-HIVE实时模型。"
dependencies:
  tools:
    - type: "mcp"
      value: "ai-hive"
      description: "AI-HIVE文本、图片、视频与多模态模型工作台"
      transport: "streamable_http"
      url: "https://ai-hive.iclip.cn/api/mcp"
policy:
  allow_implicit_invocation: true
